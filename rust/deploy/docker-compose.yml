services:
  api:
    image: hfiuc-api:2.0.0
    container_name: hfiuc-rust-api
    restart: unless-stopped
    env_file: .env
    environment:
      HFIUC_MODE: api
      BIND_ADDRESS: 0.0.0.0
      PORT: 8000
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/hfiuc-api-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s

  worker:
    image: hfiuc-api:2.0.0
    container_name: hfiuc-rust-worker
    restart: unless-stopped
    env_file: .env
    environment:
      HFIUC_MODE: worker
    networks:
      - 1panel-network
    depends_on:
      api:
        condition: service_healthy

networks:
  1panel-network:
    external: true
