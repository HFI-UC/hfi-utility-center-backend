limit_req_zone $binary_remote_addr zone=hfiuc_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.hfiuc.org;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/api.hfiuc.org;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.hfiuc.org;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/api.hfiuc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hfiuc.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HFIUC_SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~* ^/(?:\.git|\.env|wp-admin|wp-login\.php|wordpress|phpmyadmin|vendor/phpunit|cgi-bin|actuator|server-status)(?:/|$) {
        return 404;
    }

    location / {
        limit_req zone=hfiuc_api burst=30 nodelay;
        limit_except GET POST OPTIONS { deny all; }

        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    access_log /www/wwwlogs/api.hfiuc.org.log;
    error_log /www/wwwlogs/api.hfiuc.org.error.log;
}
